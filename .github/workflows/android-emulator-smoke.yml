name: Android Emulator Smoke Test

on:
  push:
    branches:
      - feature/prompt-full-implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || vars.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Configure YOUTUBE_API_KEY in GitHub Actions Secrets or Variables."
            exit 1
          fi
          echo "::add-mask::$YOUTUBE_API_KEY"
          gradle :app:assembleDebug --no-daemon -PYOUTUBE_API_KEY="$YOUTUBE_API_KEY"

      - name: Install, launch, and inspect app in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            set -eu
            APK="${{ github.workspace }}/app/build/outputs/apk/debug/app-x86_64-debug.apk"
            test -f "$APK" || { echo "Expected x86_64 debug APK was not found. Available APKs:"; find "${{ github.workspace }}/app/build/outputs/apk" -maxdepth 4 -type f -name "*.apk" -print || true; exit 1; }
            adb install -r "$APK"
            adb shell am force-stop store.oatec.playertv
            adb shell monkey -p store.oatec.playertv 1
            sleep 25
            PID="$(adb shell pidof store.oatec.playertv | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo "::error::TVI Player process exited after launch."
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
            adb logcat -d -s AndroidRuntime:E > android-runtime-errors.log
            if grep -q "FATAL EXCEPTION" android-runtime-errors.log; then
              cat android-runtime-errors.log
              exit 1
            fi
            # Capture the screen before UIAutomator: UIAutomator can fail to expose
            # a root node on some Compose/emulator combinations even when the app is alive.
            adb exec-out screencap -p > emulator-screenshot.png
            test -s emulator-screenshot.png
            if adb shell uiautomator dump /sdcard/window.xml; then
              adb pull /sdcard/window.xml emulator-ui.xml || true
            else
              echo "UIAutomator dump unavailable; process and screenshot checks remain authoritative."
            fi
            if [ ! -s emulator-ui.xml ]; then
              printf '%s\n' 'UIAutomator did not return a window hierarchy; see emulator-screenshot.png.' > emulator-ui.xml
            fi
            test -s android-runtime-errors.log
            test -s emulator-ui.xml
            test -s emulator-screenshot.png

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvi-player-emulator-evidence
          path: |
            android-runtime-errors.log
            emulator-ui.xml
            emulator-screenshot.png
          if-no-files-found: warn
          retention-days: 14