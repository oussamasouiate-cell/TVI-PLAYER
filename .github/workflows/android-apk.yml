name: Android APK

on:
  push:
    branches:
      - codespace-vigilant-bassoon-5v5gpp66gvp93pvw9
      - feature/netflix-fullscreen-movies-series
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          test -d "$ANDROID_HOME" || { echo "Android SDK not found at $ANDROID_HOME"; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; }
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build release APKs
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvi-player-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
