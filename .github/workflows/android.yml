name: Android Build and Tests

on:
  push:
    branches:
      - feature/prompt-full-implementation
  pull_request:
    branches:
      - feature/prompt-full-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Gradle automatically exposes ORG_GRADLE_PROJECT_* variables as project properties.
      ORG_GRADLE_PROJECT_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || vars.YOUTUBE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify YouTube Data API configuration
        shell: bash
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_YOUTUBE_API_KEY" ]; then
            echo "::error::Configure YOUTUBE_API_KEY in GitHub Actions Secrets or Variables so Kids Mode and movie trailers work in generated APKs."
            exit 1
          fi
          echo "YouTube Data API key is configured (value hidden)."

      - name: Build debug APKs
        run: gradle :app:assembleDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Print Android Lint report when available
        if: always()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; else echo "Lint text report not found"; fi

      - name: Build release APKs
        run: gradle :app:assembleRelease

      - name: Upload debug and release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tvi-player-apks
          path: |
            app/build/outputs/apk/debug/**/*.apk
            app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error
          retention-days: 7
